esphome:
  name: wallbox-esp
  friendly_name: "Wallbox ESP"
  includes:
    - offline_rtc.h
    - wallbox_api.h
    - wallbox_sleep.h
  platformio_options:
    build_flags:
      - -DWALLBOX_RING_SAMPLES=${chart_ring_samples}
      - -DWALLBOX_CHART_AVERAGE=${chart_average_samples}
  on_boot:
    priority: 600
    then:
      - lambda: |-
          constexpr bool kTestDeepSleep = ${test_deep_sleep};
          gpio_set_direction(GPIO_NUM_9, GPIO_MODE_INPUT);
          gpio_set_pull_mode(GPIO_NUM_9, GPIO_PULLUP_ONLY);
          const bool woke_from_sleep = esp_reset_reason() == ESP_RST_DEEPSLEEP;
          wallbox_rtc_initialize(woke_from_sleep);
          wallbox_rtc_bm2_age_initialize(woke_from_sleep);
          auto &rtc = wallbox_rtc_state;
          bool left_sleep_for_power = false;
          if (woke_from_sleep) {
            wallbox_release_led_hold(${led_gpio_num});
            const uint64_t wake_us = esp_clk_rtc_time();
            const uint64_t slept_us = rtc.mark_us != 0 ? wake_us - rtc.mark_us
                                                       : static_cast<uint64_t>(rtc.hop_s) * 1000000ULL;
            const uint32_t real_s = static_cast<uint32_t>((slept_us + 500000ULL) / 1000000ULL);
            rtc.uptime_base_us += slept_us;
            rtc.offline_elapsed_seconds += real_s;
            wallbox_rtc_add_age(real_s);
            rtc.hop_s = 0;
            if (!kTestDeepSleep) {
              gpio_set_direction(static_cast<gpio_num_t>(${vbus_gpio_num}), GPIO_MODE_INPUT);
              const bool external = ${vbus_override_enabled} ? ${vbus_override_state}
                                                             : gpio_get_level(static_cast<gpio_num_t>(${vbus_gpio_num})) != 0;
              if (external) {
                rtc.wake_after_s = 0;
                left_sleep_for_power = true;
              }
            }
            if (rtc.wake_after_s > 0) {
              id(status_led).turn_on();
              esp_rom_delay_us(${led_sleep_flash_ms} * 1000U);
              id(status_led).turn_off();
              rtc.mark_us = wake_us;
              wallbox_sleep_now(id(wallbox_safe_mode), wallbox_next_hop(), ${led_gpio_num});
            }
          }
          id(external_power_mode) = wallbox_rtc_state.external_power_mode;
          id(last_power_check_ms) = millis() - 1000UL;
          id(last_age_tick_ms) = millis();
          id(last_summary_publish_ms) = millis() - 60000UL;
          id(last_voltage_sample_ms) = millis();
          const bool sample_due = !woke_from_sleep || left_sleep_for_power || rtc.sample_period_s == 0 ||
                                  rtc.offline_elapsed_seconds >= rtc.sample_period_s;
          id(sample_record_pending) = sample_due;
          id(esp_sample_pending) = sample_due;
          id(adc_update_issued) = false;
          id(offline_sample_pending) = sample_due;
          id(automatic_ble_cycle) = sample_due;
          wallbox_rtc_state.sample_pending = sample_due ? 1 : 0;
          wallbox_bt_devices_initialize();
          wallbox_bt_devices_clear();
          id(bt_scan_results).publish_state("0");
          wallbox_register_voltage_api();
      - component.update: firmware_info
      - component.update: reset_info
      - if:
          condition:
            lambda: 'return id(automatic_ble_cycle);'
          then:
            - esp32_ble_tracker.start_scan:
                continuous: true
            - ble_client.connect: bm2_ble_client

substitutions:
  # Wykres: probek w ringach RTC i usrednianie co N probek; max punktow = (ring - 2) / N w gore + 2 (pierwszy i ostatni).
  chart_ring_samples: "400"
  chart_average_samples: "2"
  # Symulator deep sleep: 5 min snu (budzenie co 10 s na mrugniecie diody) + 1 min aktywnosci.
  test_deep_sleep: "false"
  test_sleep_minutes: "5"
  test_active_minutes: "1"
  led_gpio_num: "15"
  led_sleep_flash_ms: "3"
  led_normal_flash_ms: "10"
  vbus_gpio: GPIO18
  vbus_gpio_num: "18"
  # Bez fizycznego dzielnika wymuszaj VBUS=HIGH, żeby wejście nie wisiało.
  # Test baterii: vbus_override_enabled="true", vbus_override_state="false".
  # Po montażu dzielnika: vbus_override_enabled="false".
  vbus_override_enabled: "false"
  vbus_override_state: "true"

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "16"

logger:
  level: INFO

wifi:
  ssid: "Your SSID"
  password: "Your password"
  reboot_timeout: 0s
  power_save_mode: HIGH
  ap:
    ssid: "Wallbox ESP"
    ap_timeout: 0s

captive_portal:

deep_sleep:
  id: power_sleep

safe_mode:
  id: wallbox_safe_mode

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: my_components
    components: [bm2_ble]

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: power_calibration
      name: "Zasilanie i kalibracja"
      sorting_weight: 100
  js_include: wallbox_dashboard.js
  css_include: wallbox_dashboard.css

globals:
  - id: last_bm2_rssi_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sample_record_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: esp_sample_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: adc_update_issued
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: offline_sample_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: offline_ble_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: automatic_ble_cycle
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: external_power_mode
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: last_power_check_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_age_tick_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_summary_publish_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: offline_cycle_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_voltage_sample_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: user_button_held
    type: bool
    restore_value: no
    initial_value: 'false'

# D10 = GPIO18. Przy dzielniku 100k/100k z VBUS pin osiąga ok. 2.5 V.
binary_sensor:
  - platform: template
    id: vbus_gpio_sampled
    name: "Zasilanie zewn (GPIO18)"
    device_class: power
    web_server:
      sorting_group_id: power_calibration
      sorting_weight: 10

  - platform: template
    id: vbus_present
    internal: true
    lambda: |-
      return ${vbus_override_enabled} ? ${vbus_override_state} : id(vbus_gpio_sampled).state;

  - platform: template
    id: vbus_override_active
    name: "VBUS override aktywny"
    lambda: return ${vbus_override_enabled};

  - platform: template
    name: "Stycznik – stan"
    id: contactor_state

number:
  - platform: template
    name: "ADC factor"
    id: adc_factor
    min_value: 0.95
    max_value: 1.1
    step: 0.001
    initial_value: 1.033
    restore_value: true
    optimistic: true
    web_server:
      sorting_group_id: power_calibration
      sorting_weight: 20
    on_value:
      then:
        - component.update: internal_battery_voltage

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    active: true
    continuous: false
  on_ble_advertise:
    - then:
        - lambda: |-
            const std::string mac = x.address_str();
            uint64_t observed_address = 0;
            uint64_t configured_address = 0;
            const bool is_bm2 = wallbox_parse_mac(mac, &observed_address) &&
                                wallbox_parse_mac(id(bm2_mac_input).state, &configured_address) &&
                                observed_address == configured_address;
            if (is_bm2) {
              id(last_bm2_rssi_ms) = millis();
              id(bm2_signal_rssi).publish_state(x.get_rssi());
            }
            if (!id(bt_scan_control).state) return;
            const std::string advertised_name = x.get_name();
            const size_t device_count = wallbox_bt_device_observe(mac, advertised_name, millis(), x.get_rssi());
            id(bt_scan_results).publish_state(std::to_string(device_count));

ble_client:
  - mac_address: "9C:1D:58:11:E7:86"
    id: bm2_ble_client
    auto_connect: false
    on_connect:
      then:
        - component.update: bm2_connected_rssi

bm2_ble:
  id: bm2_ble_hub
  ble_client_id: bm2_ble_client

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Warsaw

output:
  - platform: gpio
    id: contactor_out
    pin: GPIO16
  - platform: gpio
    id: status_led
    pin: GPIO15
    inverted: true

sensor:
  - platform: wifi_signal
    name: "Sygnał WiFi"
    update_interval: 60s
  - platform: internal_temperature
    id: chip_temperature
    name: "Temperatura ESP32"
    update_interval: 60s
    accuracy_decimals: 1
  - platform: adc
    id: internal_battery_voltage
    name: "Napięcie własne ESP (ADC)"
    pin: GPIO0
    attenuation: 12db
    update_interval: never
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
      - lambda: return x * id(adc_factor).state;
      - sliding_window_moving_average:
          window_size: 8
          send_every: 1
    on_value:
      then:
        - lambda: |-
            const float voltage = x;
            ESP_LOGI("battery_adc", "Odczyt napięcia ADC: %.2f V", voltage);
            id(external_power_mode) = ${vbus_override_enabled} ? ${vbus_override_state} : id(vbus_gpio_sampled).state;
            if (!id(esp_sample_pending)) return;
            id(esp_sample_pending) = false;
            id(adc_update_issued) = false;
            wallbox_rtc_push_esp(voltage);
            id(chip_temperature).update();
            if (!std::isnan(id(chip_temperature).state)) wallbox_rtc_push_temp(id(chip_temperature).state);
            wallbox_rtc_state.sample_pending = 1;
            wallbox_rtc_state.offline_elapsed_seconds = 0;
            id(last_voltage_sample_ms) = millis();
  - platform: bm2_ble
    id: bm2_voltage
    bm2_ble_id: bm2_ble_hub
    type: voltage
    name: "Napięcie akumulatora BM2 (BT)"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    on_value:
      then:
        - lambda: |-
            if (!id(sample_record_pending) || !std::isfinite(x) || x <= 5.0f || x >= 30.0f) return;
            wallbox_rtc_push_bm2(x);
            wallbox_rtc_bm2_age.seconds = 0;
            wallbox_rtc_state.sample_pending = 0;
            wallbox_rtc_state.offline_elapsed_seconds = 0;
            id(sample_record_pending) = false;
            id(offline_sample_pending) = false;
            if (!id(bt_scan_control).state) {
              id(bm2_ble_client).disconnect();
              id(ble_tracker).stop_scan();
            }
  - platform: template
    id: bm2_rssi
    name: "Sygnał BT BM2"
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return static_cast<float>(wallbox_rtc_bm2_age.seconds / 60U);
  - platform: template
    id: bm2_signal_rssi
    name: "Sygnał radiowy BM2"
    unit_of_measurement: "dBm"
    accuracy_decimals: 0
    device_class: signal_strength
    update_interval: 2s
    lambda: |-
      if (id(last_bm2_rssi_ms) == 0 || static_cast<uint32_t>(millis() - id(last_bm2_rssi_ms)) > 30000U)
        return NAN;
      return id(bm2_signal_rssi).state;
  - platform: ble_client
    type: rssi
    id: bm2_connected_rssi
    ble_client_id: bm2_ble_client
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            if (!std::isfinite(x)) return;
            id(last_bm2_rssi_ms) = millis();
            id(bm2_signal_rssi).publish_state(x);

text:
  - platform: template
    id: bm2_mac_input
    name: "Adres MAC BM2"
    mode: TEXT
    min_length: 17
    max_length: 17
    pattern: "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$"
    initial_value: "9C:1D:58:11:E7:86"
    restore_value: true
    optimistic: true

select:
  - platform: template
    name: "Okres próbkowania napięcia"
    id: voltage_sample_interval_select
    options:
      - "1 minuta"
      - "15 minut"
      - "30 minut"
      - "1 h"
      - "2 h"
      - "4 h"
      - "6 h"
      - "12 h"
      - "24 h"
    initial_option: "1 h"
    restore_value: true
    optimistic: true

text_sensor:
  - platform: template
    name: "Statystyka odczytow BM2"
    update_interval: 10s
    lambda: |-
      return std::to_string(wallbox_rtc_bm2_stats.successes) + " / " +
             std::to_string(wallbox_rtc_bm2_stats.attempts) + " (udane / proby)";
  - platform: template
    id: bt_scan_results
    name: "Bluetooth scan results"
    icon: mdi:bluetooth-search
    update_interval: never
  - platform: template
    id: firmware_info
    name: "Kompilacja firmware"
    icon: mdi:calendar-clock
    update_interval: never
    lambda: return std::string(__DATE__) + " " + __TIME__;
  - platform: template
    id: reset_info
    name: "Ostatni reset"
    update_interval: never
    lambda: |-
      switch (esp_reset_reason()) {
        case ESP_RST_POWERON: return {"POWERON"};
        case ESP_RST_EXT: return {"RESET PIN"};
        case ESP_RST_SW: return {"SOFTWARE"};
        case ESP_RST_PANIC: return {"PANIC"};
        case ESP_RST_INT_WDT: return {"WDT INT"};
        case ESP_RST_TASK_WDT: return {"WDT TASK"};
        case ESP_RST_WDT: return {"WDT"};
        case ESP_RST_BROWNOUT: return {"BROWNOUT"};
        case ESP_RST_DEEPSLEEP: return {"DEEP SLEEP WAKE"};
        default: return {"OTHER"};
      }
  - platform: template
    name: "Czas (NTP)"
    update_interval: 1s
    lambda: |-
      if (!id(sntp_time).now().is_valid()) return {"NTP: brak synchronizacji"};
      return id(sntp_time).now().strftime("%Y-%m-%d %H:%M:%S");
  - platform: template
    name: "Czas pracy"
    update_interval: 60s
    lambda: |-
      const uint64_t seconds = wallbox_uptime_seconds(millis());
      char buffer[40];
      snprintf(buffer, sizeof(buffer), "%llud %lluh %llum", seconds / 86400ULL, (seconds % 86400ULL) / 3600ULL,
               (seconds % 3600ULL) / 60ULL);
      return std::string(buffer);

switch:
  - platform: template
    name: "Tryb oszczędzania energii"
    id: energy_saving_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Skaner Bluetooth"
    id: bt_scan_control
    icon: mdi:bluetooth
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          if (!id(automatic_ble_cycle)) {
            wallbox_bt_devices_clear();
            id(bt_scan_results).publish_state("0");
          }
      - esp32_ble_tracker.start_scan:
          continuous: true
      - ble_client.connect: bm2_ble_client
    turn_off_action:
      - ble_client.disconnect: bm2_ble_client
      - esp32_ble_tracker.stop_scan:
  - platform: template
    name: "Stycznik (MANUAL)"
    id: manual_contactor
    optimistic: true
    turn_on_action:
      - output.turn_on: contactor_out
      - binary_sensor.template.publish:
          id: contactor_state
          state: true
    turn_off_action:
      - output.turn_off: contactor_out
      - binary_sensor.template.publish:
          id: contactor_state
          state: false

button:
  - platform: restart
    name: "Restart ESP32"
    id: restart_esp32
    icon: mdi:restart

interval:
  - interval: 1s
    then:
      - lambda: |-
          constexpr bool kTestDeepSleep = ${test_deep_sleep};
          const uint32_t now = millis();
          static std::string applied_bm2_mac = "9C:1D:58:11:E7:86";
          uint64_t configured_bm2_mac = 0;
          if (wallbox_parse_mac(id(bm2_mac_input).state, &configured_bm2_mac) &&
              id(bm2_mac_input).state != applied_bm2_mac) {
            id(bm2_ble_client).disconnect();
            id(bm2_ble_client).set_address(configured_bm2_mac);
            id(last_bm2_rssi_ms) = 0;
            id(bm2_signal_rssi).publish_state(NAN);
            applied_bm2_mac = id(bm2_mac_input).state;
            ESP_LOGI("bm2", "BM2 MAC changed to %s", applied_bm2_mac.c_str());
          }
          static uint32_t last_connected_rssi_poll_ms = 0;
          if (id(bm2_ble_client).connected() &&
              static_cast<uint32_t>(now - last_connected_rssi_poll_ms) >= 5000U) {
            last_connected_rssi_poll_ms = now;
            id(bm2_connected_rssi).update();
          }
          static bool vbus_pin_configured = false;
          if (!vbus_pin_configured) {
            gpio_set_direction(static_cast<gpio_num_t>(${vbus_gpio_num}), GPIO_MODE_INPUT);
            vbus_pin_configured = true;
          }
          const bool raw_vbus = gpio_get_level(static_cast<gpio_num_t>(${vbus_gpio_num})) != 0;
          id(vbus_gpio_sampled).publish_state(raw_vbus);
          const bool vbus_present_now = ${vbus_override_enabled} ? ${vbus_override_state} : raw_vbus;
          if (id(esp_sample_pending) && !id(adc_update_issued)) {
            id(adc_update_issued) = true;
            id(internal_battery_voltage).update();
          }
          const bool vbus_high = ${vbus_override_enabled} ? ${vbus_override_state} : id(vbus_gpio_sampled).state;
          if (static_cast<uint32_t>(now - id(last_power_check_ms)) >= 1000U) {
            id(last_power_check_ms) = now;
            id(external_power_mode) = vbus_high;
          }

          if (kTestDeepSleep) {
            if (!id(offline_ble_mode)) {
              id(offline_ble_mode) = true;
              id(offline_cycle_started_ms) = now;
            }
            if (static_cast<uint32_t>(now - id(offline_cycle_started_ms)) >= ${test_active_minutes} * 60000U) {
              if (id(sample_record_pending)) {
                wallbox_rtc_push_bm2(0.0f);
                id(sample_record_pending) = false;
              }
              id(bm2_ble_client).disconnect();
              id(ble_tracker).stop_scan();
              auto &rtc = wallbox_rtc_state;
              const uint32_t active_s = static_cast<uint32_t>(now - id(offline_cycle_started_ms)) / 1000U;
              if (rtc.offline_elapsed_seconds == 0) rtc.offline_elapsed_seconds = (now - id(last_voltage_sample_ms)) / 1000U;
              else rtc.offline_elapsed_seconds += active_s;
              rtc.sample_period_s = wallbox_sample_period_minutes(id(voltage_sample_interval_select).current_option()) * 60U;
              rtc.sample_pending = 0;
              rtc.uptime_base_us += static_cast<uint64_t>(now) * 1000ULL;
              rtc.mark_us = esp_clk_rtc_time();
              wallbox_sleep_now(id(wallbox_safe_mode), wallbox_plan_sleep(${test_sleep_minutes} * 60U), ${led_gpio_num});
            }
          } else if (!id(energy_saving_mode).state || id(external_power_mode)) {
            if (id(external_power_mode)) wallbox_rtc_state.offline_elapsed_seconds = 0;
            bool force_sample = false;
            if (id(offline_ble_mode)) {
              id(offline_ble_mode) = false;
              id(offline_sample_pending) = false;
              id(automatic_ble_cycle) = false;
              id(sample_record_pending) = false;
              id(esp_sample_pending) = false;
              id(adc_update_issued) = false;
              wallbox_rtc_state.sample_pending = 0;
              id(bm2_ble_client).disconnect();
              id(ble_tracker).stop_scan();
              force_sample = true;
            }
            const uint32_t interval_ms =
              wallbox_sample_period_minutes(id(voltage_sample_interval_select).current_option()) * 60000U;
            if (!id(sample_record_pending) &&
                (force_sample || static_cast<uint32_t>(now - id(last_voltage_sample_ms)) >= interval_ms)) {
              id(sample_record_pending) = true;
              id(esp_sample_pending) = true;
              id(adc_update_issued) = false;
              id(offline_sample_pending) = true;
              id(automatic_ble_cycle) = true;
              id(offline_cycle_started_ms) = now;
              wallbox_rtc_state.sample_pending = 1;
              id(ble_tracker).start_scan();
              id(bm2_ble_client).connect();
            }
            if (id(automatic_ble_cycle) && static_cast<uint32_t>(now - id(offline_cycle_started_ms)) >= 45000) {
              if (id(sample_record_pending)) {
                wallbox_rtc_push_bm2(0.0f);
                id(sample_record_pending) = false;
              }
              id(bm2_ble_client).disconnect();
              id(ble_tracker).stop_scan();
              id(sample_record_pending) = false;
              id(esp_sample_pending) = false;
              id(adc_update_issued) = false;
              id(offline_sample_pending) = false;
              wallbox_rtc_state.sample_pending = 0;
              id(automatic_ble_cycle) = false;
            }
          } else if (id(energy_saving_mode).state) {
            if (!id(offline_ble_mode)) {
              id(offline_ble_mode) = true;
              id(offline_cycle_started_ms) = now;
              const uint32_t sample_period_seconds =
                wallbox_sample_period_minutes(id(voltage_sample_interval_select).current_option()) * 60U;
                id(offline_sample_pending) = id(sample_record_pending) ||
                  wallbox_rtc_state.offline_elapsed_seconds >= sample_period_seconds;
              wallbox_rtc_state.sample_pending = id(offline_sample_pending);
              if (id(offline_sample_pending)) {
                id(sample_record_pending) = true;
                id(esp_sample_pending) = true;
                id(adc_update_issued) = false;
                id(automatic_ble_cycle) = true;
                id(ble_tracker).start_scan();
                id(bm2_ble_client).connect();
              }
            }
            const uint32_t active_window = id(offline_sample_pending) ? 45000 : 1000;
            if (static_cast<uint32_t>(now - id(offline_cycle_started_ms)) >= active_window) {
              if (id(offline_sample_pending) && id(sample_record_pending)) {
                wallbox_rtc_push_bm2(0.0f);
                id(sample_record_pending) = false;
              }
              id(bm2_ble_client).disconnect();
              id(ble_tracker).stop_scan();
              if (id(external_power_mode) || !id(energy_saving_mode).state) {
                id(offline_ble_mode) = false;
                id(automatic_ble_cycle) = false;
              } else {
